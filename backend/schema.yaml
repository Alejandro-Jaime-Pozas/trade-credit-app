    PatchedRequirementTemplate:
      type: object
      description: |-
        An organization's reusable list of documents to ask for on a credit case.

        `items` is writable and behaves as a full replacement: whatever list is sent becomes
        the template's contents. That matches how the UI edits a template (as one list the
        user rearranges) and keeps the client from having to diff line-by-line.

        Editing a template does NOT change existing credit cases. Use the `impact` and
        `apply` actions on this viewset to review and push changes onto open cases.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: What the user calls this template, e.g. "Default" or "Clientes
            grandes".
          maxLength: 100
        is_default:
          type: boolean
          description: Whether new credit cases in this organization use this template
            automatically. At most one per organization.
        organization:
          type: object
          properties:
            url:
              type: string
              format: uri
            display:
              type: string
          required:
          - url
          - display
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequirementTemplateItem'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PatchedUploadDocument:
      type: object
      description: |-
        Identical to DRF's `HyperlinkedModelSerializer`, except every relation field it
        auto-builds (a ForeignKey/ManyToMany to another model) uses `NamedHyperlinkedRelatedField`
        above instead of the plain `HyperlinkedRelatedField`. Every serializer in this app that
        links to OTHER objects should subclass this instead of `serializers.HyperlinkedModelSerializer`.

        Only relation fields are affected — a resource's OWN identity `url` field (e.g. a
        CreditCase's own `url`) is built separately by DRF (`serializer_url_field`) and is
        untouched by this, by design: that field is how the browsable API/frontend already
        identifies "this specific record", not a link to something else.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        uploaded_at:
          type: string
          format: date-time
          readOnly: true
        original_title:
          type: string
          readOnly: true
          nullable: true
          description: the uploaded file's unmodified original title.
        file:
          type: string
          format: uri
          description: the file object that is stored.
          pattern: (?:pdf|jpg|jpeg|png|txt|csv|xml|json|docx|xlsx|pptx)$
        friendly_file_name:
          type: string
          nullable: true
          description: friendly file name for readability.
          maxLength: 512
        file_type_name:
          type: string
          nullable: true
          description: 'The kind of document this is, as a file type key (e.g. "bank_statement").
            Set by the GPT classification step after upload, not by the user. Deliberately
            has no `choices`: valid keys live in the storage.FileType table (seeded
            from core/file_type_catalog.py) so organizations can eventually define
            their own types, which a static enum could never list.'
          maxLength: 50
        classification_status:
          type: string
          description: |-
            One of `classified`, `processing`, `unclassified`.

