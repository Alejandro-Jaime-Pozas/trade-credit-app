        file_type_key:
          type: string
          readOnly: true
        label_en:
          type: string
          readOnly: true
        label_es:
          type: string
          readOnly: true
        is_required:
          type: boolean
          description: True means a credit case is incomplete without it. False means
            it is shown as a nice-to-have and never blocks completion.
        months_required:
          type: integer
          maximum: 32767
