    PatchedCreditCase:
      type: object
      description: |-
        Identical to DRF's `HyperlinkedModelSerializer`, except every relation field it
        auto-builds (a ForeignKey/ManyToMany to another model) uses `NamedHyperlinkedRelatedField`
        above instead of the plain `HyperlinkedRelatedField`. Every serializer in this app that
        links to OTHER objects should subclass this instead of `serializers.HyperlinkedModelSerializer`.

        Only relation fields are affected — a resource's OWN identity `url` field (e.g. a
        CreditCase's own `url`) is built separately by DRF (`serializer_url_field`) and is
        untouched by this, by design: that field is how the browsable API/frontend already
        identifies "this specific record", not a link to something else.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        status:
          description: |-
            Credit case status like missing docs, pending ai verdict, etc. Items are in order of sequence.

            * `missing_documents` - Missing Documents
            * `pending_ai_verdict` - Pending AI Verdict
            * `buro_de_credito_rejected` - Buro De Credito Rejected
            * `pending_final_verdict` - Pending Final Verdict
            * `complete` - Complete
          oneOf:
          - $ref: '#/components/schemas/StatusEnum'
          - $ref: '#/components/schemas/BlankEnum'
        verdict:
          description: |-
            Credit case status like pending, approved, rejected. Items are in order of sequence.

            * `pending` - Pending
            * `approved` - Approved
            * `rejected` - Rejected
          oneOf:
          - $ref: '#/components/schemas/VerdictEnum'
          - $ref: '#/components/schemas/BlankEnum'
        requested_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,30}(?:\.\d{0,2})?$
          nullable: true
          description: Requested credit line amount.
        currency:
          allOf:
          - $ref: '#/components/schemas/CurrencyEnum'
          description: |-
            Currency for the requested credit line amount.

            * `MXN` - MXN
        requested_term_days:
          nullable: true
          description: |-
            Requested net terms (days).

            * `15` - 15 days
            * `30` - 30 days
            * `45` - 45 days
            * `60` - 60 days
            * `90` - 90 days
          minimum: -2147483648
          maximum: 2147483647
          oneOf:
          - $ref: '#/components/schemas/RequestedTermDaysEnum'
          - $ref: '#/components/schemas/NullEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Submitted for human approval timestamp.
        verdict_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: Final verdict timestamp after human review.
        assigned_to:
          type: object
          properties:
            url:
              type: string
              format: uri
            display:
              type: string
          required:
          - url
          - display
          nullable: true
        customer:
          type: object
          properties:
            url:
              type: string
              format: uri
            display:
              type: string
          required:
          - url
          - display
        organization:
          type: object
          properties:
            url:
              type: string
              format: uri
            display:
              type: string
          required:
          - url
          - display
          readOnly: true
        required_file_type_names:
          type: array
          items:
            type: string
          readOnly: true
        optional_file_type_names:
          type: array
          items:
            type: string
          readOnly: true
        requirements_complete:
          type: boolean
          readOnly: true
        requirements_completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When every required document for this case had been uploaded
            and classified. Stamped once, the first time it happens, as a record of
            when the file requirements were satisfied. Whether the case is complete
            RIGHT NOW is answered by the requirements_complete property, which is
            always derived from the current documents.
        requirement_template:
          type: integer
          writeOnly: true
          nullable: true
        custom_fields:
          type: object
          additionalProperties:
            type: string
          readOnly: true
    PatchedCreditCaseRequirement:
      type: object
      description: |-
        One document a specific credit case needs.

        Requirements created through this endpoint are always `source='manual'` — they are
        the per-case additions a user makes for one particular customer, and a later template
        re-sync will leave them untouched. Template-sourced rows are created by seeding, not
        here.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        credit_case:
          type: object
          properties:
            url:
              type: string
              format: uri
            display:
              type: string
          required:
          - url
          - display
          description: The credit case that needs this document.
        file_type:
          type: integer
        file_type_key:
          type: string
          readOnly: true
        label_en:
          type: string
          readOnly: true
        label_es:
          type: string
          readOnly: true
        is_required:
          type: boolean
          default: true
        months_required:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          description: Overrides FileType.months_required for this case only.
        source:
          allOf:
          - $ref: '#/components/schemas/SourceEnum'
          readOnly: true
          description: |-
            Whether this came from a template (re-syncable) or was added by hand for this case (never overwritten by a re-sync).

            * `template` - Template
            * `manual` - Manual
        created_at:
          type: string
          format: date-time
          readOnly: true
        synced_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
          description: When this row was last added or changed by a template re-sync.
            Null means it has not been touched since the case was created.
