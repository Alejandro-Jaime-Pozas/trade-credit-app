    RequirementTemplate:
      type: object
      description: |-
        An organization's reusable list of documents to ask for on a credit case.

        `items` is writable and behaves as a full replacement: whatever list is sent becomes
        the template's contents. That matches how the UI edits a template (as one list the
        user rearranges) and keeps the client from having to diff line-by-line.

        Editing a template does NOT change existing credit cases. Use the `impact` and
        `apply` actions on this viewset to review and push changes onto open cases.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: What the user calls this template, e.g. "Default" or "Clientes
            grandes".
          maxLength: 100
        is_default:
          type: boolean
          description: Whether new credit cases in this organization use this template
            automatically. At most one per organization.
        organization:
          type: object
          properties:
            url:
              type: string
              format: uri
            display:
              type: string
          required:
          - url
          - display
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/RequirementTemplateItem'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - items
      - name
      - organization
      - updated_at
      - url
