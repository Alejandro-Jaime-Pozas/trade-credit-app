    FileType:
      type: object
      description: |-
        A kind of document the app can recognize, e.g. "bank_statement".

        Read-only: the app-provided types come from core/file_type_catalog.py via
        `manage.py sync_file_types`. Letting organizations create their own is planned
        (see docs/versions/v2.md) but not implemented.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        key:
          type: string
          description: Stable identifier matching UploadDocument.file_type_name, e.g.
            "bank_statement". Never change this after creation — documents are already
            stored under it. Rename label_en/label_es instead.
          maxLength: 50
        label_en:
          type: string
          description: Display name in English, e.g. "Bank statement".
          maxLength: 100
        label_es:
          type: string
          description: Display name in Spanish, e.g. "Estado de cuenta bancario".
          maxLength: 100
        category:
          type: string
          description: 'One of core.file_type_catalog.FileTypeCategory: financial,
            legal or other. Decides how recent a document must be to still count.'
          maxLength: 20
        group:
          type: string
          description: 'Which heading this type is listed under when a user picks
            documents, e.g. "financial" or "tax" (see core.file_type_catalog.FileTypeGroup).
            Display only. Deliberately NOT the same as `category`: that is a recency
            bucket, which is why a timeless acta constitutiva is category "other"
            but group "legal".'
          maxLength: 20
        group_label:
          type: string
          description: |-
            The heading this type is listed under, e.g. "Tax / SAT".

            Sent rather than left to the client so the frontend never keeps its own copy of
            the group list — a hardcoded copy would silently go stale the day a group is
            added to the catalog, which is the same reason file types themselves are served
            rather than hardcoded.
          readOnly: true
        group_order:
          type: integer
          description: |-
            Where this type's group sits in the order a person should meet them (financials
            first, odds and ends last). A sort key, so the frontend orders groups the way the
            catalog declares rather than alphabetically — "Credit process" before "Financial"
            would read as nonsense. Unknown groups sort last.
          readOnly: true
        months_required:
          type: integer
          maximum: 32767
          minimum: 0
          nullable: true
          description: How many distinct months this document must cover to satisfy
            a requirement (e.g. 12 monthly bank statements). Null means one document
            is enough regardless of period.
        is_active:
          type: boolean
          description: Whether this type can still be added to new templates. Existing
            documents keep resolving either way — a type is never deleted, because
            documents already reference its key.
        is_default_suggestion:
          type: boolean
          description: Whether this type is pre-ticked when an organization builds
            its first requirement template. A starting point only — the organization
            can remove any of them and add any other type.
        is_global:
          type: boolean
          description: True for app-provided types, which every organization can use.
          readOnly: true
      required:
      - category
      - group_label
      - group_order
      - id
      - is_global
      - key
      - label_en
      - label_es
      - url
    Label:
      type: object
      description: |-
        A Label is a custom field *definition* the user creates, e.g. "sucursal" for
        CreditCase. `content_type` picks which single model it applies to, by model
        name (e.g. "creditcase") rather than a raw database id, since ContentType ids
        aren't stable across databases.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: The custom field name, e.g. "sucursal".
          maxLength: 50
        content_type:
          type: string
          title: Python model class name
        organization:
          type: object
          properties:
            url:
              type: string
              format: uri
            display:
              type: string
          required:
          - url
          - display
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - id
      - name
      - organization
      - url
    LabelValue:
      type: object
      description: |-
        The value of a Label (custom field) for one specific object, e.g.
        label="sucursal", object_id=<some CreditCase id>, value="MTY Norte".

        `content_type` is never taken from the client — it's always derived from
        `label.content_type`, so a value can never end up attached to the wrong kind
        of object.
      properties:
        url:
          type: string
          format: uri
          readOnly: true
        id:
          type: integer
          readOnly: true
        label:
          type: object
          properties:
            url:
              type: string
              format: uri
            display:
              type: string
          required:
          - url
          - display
          description: The custom field definition this value belongs to.
        content_type:
          type: string
          title: Python model class name
          readOnly: true
        object_id:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: The primary key of the labeled object.
        value:
          type: string
          description: The field value, e.g. "MTY Norte".
          maxLength: 250
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - content_type
      - created_at
      - id
      - label
      - object_id
      - updated_at
      - url
      - value
    ModelVersionEnum:
      enum:
      - gpt-5-nano
      type: string
