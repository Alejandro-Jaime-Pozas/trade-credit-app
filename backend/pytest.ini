[pytest]
# Point pytest-django at the project settings (same module manage.py uses).
DJANGO_SETTINGS_MODULE = app.settings
# Only collect files named test_*.py (matches the existing tests/ layout).
python_files = test_*.py
# Reuse the test database between runs for speed; add --create-db to rebuild it
# (e.g. after model/migration changes).
addopts = --reuse-db
