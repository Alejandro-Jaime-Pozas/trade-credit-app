services:
  backend:
    build:
      context: ./backend
    ports:
      - 8000:8000
    env_file:
      - .env
    volumes:
      - ./backend:/backend
    command: >
      sh -c "python manage.py migrate && \
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs the same backend image as a Celery worker instead of a web server. Document
  # classification (3 OpenAI round trips, 10-30s) happens here rather than inside the
  # upload request, so no HTTP request - and no database transaction - waits on OpenAI.
  #
  # Same build context and volume mount as `backend` on purpose: it IS the same codebase,
  # just running the worker loop, and code edits reload here the same way they do there.
  celery-worker:
    build:
      context: ./backend
    env_file:
      - .env
    volumes:
      - ./backend:/backend
    # --concurrency stays low deliberately: each task is bound by OpenAI's rate limits,
    # not by CPU, so more workers would just collect 429s faster.
    command: celery -A app worker --loglevel=info --concurrency=4
    depends_on:
      postgres-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Message broker: the queue the django backend container pushes jobs onto and
  # the celery-worker service pulls them off. Used only as a broker here, not as a cache.
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 2s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
    ports:
      - 3000:3000
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/api/v1
    volumes:
      - ./frontend:/frontend
      - ./backend:/backend:ro
      - frontend-node-modules:/frontend/node_modules
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    depends_on:
      - backend

  postgres-db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trade_credit_app_user} -d ${POSTGRES_DB:-trade_credit_app_db}" ]
      interval: 2s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  frontend-node-modules:
  redis-data:
